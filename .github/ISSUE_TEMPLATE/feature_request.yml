name: Feature request
description: Suggest an improvement or new capability.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the use case, not just the implementation idea.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: Explain the behavior you want and how you expect it to work.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Where would this help?
      multiple: true
      options:
        - iPhone / iPad
        - Android
        - Desktop browser
        - All platforms
    validations:
      required: false
